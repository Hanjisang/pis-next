spring:
  application:
    name: pis-next
  datasource:
    url: jdbc:postgresql://${PIS_DB_HOST:localhost}:${PIS_DB_PORT:5432}/${PIS_DB_NAME:pis}
    username: ${PIS_DB_USER:pis}
    password: ${PIS_DB_PASSWORD}
  flyway:
    enabled: true
    schemas: pis
    default-schema: pis
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PIS_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: PIS Next
    phase: P15

pis:
  runtime-environment: ${PIS_RUNTIME_ENV:local}
  actor-id: ${PIS_ACTOR_ID:p15-local-registration-actor}
  actor-permissions: ${PIS_ACTOR_PERMISSIONS:P14-PERM-001,P14-PERM-002,P14-PERM-003,P14-PERM-004,P14-PERM-008,P14-PERM-009,P14-PERM-010,P14-PERM-011,P14-PERM-044,P14-PERM-046,P14-PERM-047,P14-PERM-048,P14-PERM-049}

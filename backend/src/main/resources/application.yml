spring:
  application:
    name: pis-next
  datasource:
    url: jdbc:postgresql://${PIS_DB_HOST:localhost}:${PIS_DB_PORT:5432}/${PIS_DB_NAME:pis}
    username: ${PIS_DB_USER:pis}
    password: ${PIS_DB_PASSWORD}
  flyway:
    enabled: true
    schemas: pis
    default-schema: pis
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PIS_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: PIS Next
    phase: P19

pis:
  runtime-environment: ${PIS_RUNTIME_ENV:local}
  trusted-runtime-environments: ${PIS_TRUSTED_RUNTIME_ENVIRONMENTS:local,test}
  require-auth: ${PIS_REQUIRE_AUTH:false}
  auth-cookie-secure: ${PIS_AUTH_COOKIE_SECURE:false}
  auth-test-password: ${PIS_AUTH_TEST_PASSWORD:}
  actor-id: ${PIS_ACTOR_ID:p15-local-registration-actor}
  subject-type-code: ${PIS_ACTOR_SUBJECT_TYPE:HUMAN_USER}
  actor-task-scope: ${PIS_ACTOR_TASK_SCOPE:P15-REGISTRATION-RECEIVING,P16-GROSSING-BLOCK-LABELING,P17-TECHNICAL-PROCESSING-EMBEDDING,P18-TECHNICAL-ORDER,P19-DIAGNOSIS-REPORT}
  actor-permissions: ${PIS_ACTOR_PERMISSIONS:P14-PERM-001,P14-PERM-002,P14-PERM-003,P14-PERM-004,P14-PERM-008,P14-PERM-009,P14-PERM-010,P14-PERM-011,P14-PERM-013,P14-PERM-014,P14-PERM-015,P14-PERM-016,P14-PERM-017,P14-PERM-029,P14-PERM-034,P14-PERM-035,P14-PERM-036,P14-PERM-042,P14-PERM-044,P14-PERM-046,P14-PERM-047,P14-PERM-048,P14-PERM-049,P14-PERM-050,P14-PERM-055,P14-PERM-057,P14-PERM-058}
